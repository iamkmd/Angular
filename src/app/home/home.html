<!-- //Interpolation example  -->
<h1> {{ name }} </h1>
<button (click)="onClick()">Click On me </button>
<!-- Click Events all are the Built in Events we can use -->
<br>
<h2>Count : {{ count}} </h2>

<input (input)="hasEvent($event.type)">
<input (change)="hasEvent($event.type)">

<select name="cars" (change)="hasEvent($event.type)">
    <option value="">Verna</option>
    <option value="">Toyota</option>
    <option value="">Creata</option>
</select>

<br>
<input  name="" id="" (blur)="hasEvent($event.type)">

<br><br>
<input (focus)="hasEvent($event.type)">

<div class="div1" (mouseleave)="hasEvent($event.type)">
     
</div>

<div class="div2" (mouseenter)="hasEvent($event.type)">

</div>

<!-- //Property Binding -->
<br>
<br>
<button [disabled]="btn_Disable">Click Me</button>
<button disabled="{{btn_Disable}}">Click Me</button>
<button (click)="toggle()">Toggle</button>

<!-- //In element  Attributes sometimes it can't work correctly with 
//Boolean Values and we can't get the expected Output
//So in that case we use Property Binding -->
<input type="text" readonly="{{inputBinding}}">
<input type="text" [readonly]="inputBinding">
<br>
<br>
<img src="{{ url }}" alt="The Colurful Eyes">

<!-- Signals -->
<p> {{data()}} </p>
<p> {{counter}} </p>
